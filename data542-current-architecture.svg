  <line x1="870" y1="212" x2="946" y2="212" stroke="#5a4aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1055" y1="244" x2="1055" y2="326" stroke="#FFB347" stroke-width="1.5" marker-end="url(#arrAmber)"/>

